name: Build MagicSMP

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract project source
        run: unzip -o project-source.zip

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build MagicSMP
        run: gradle clean build --stacktrace

      - name: Upload MagicSMP JAR
        uses: actions/upload-artifact@v4
        with:
          name: MagicSMP
          path: build/libs/*.jar
